{% extends "learning_logs/base.html" %}
{% load static %}

{% block page_header %}
    <link rel="stylesheet" href="{% static 'learning_logs/css/chatbot.css' %}">
<h4>Ask anything about the books
    <a href="{% url 'learning_logs:clear_chat' %}" class="btn btn-sm btn-outline-secondary ms-2">Clear history</a>
</h4>

<div id="chat-container">
    <div id="chat-messages">
        <div class="message bot-message">
            Hi! I've read the books in this library. Ask me anything about them, or upload files and I'll answer questions about them
        </div>
    </div>
    <div id="chat-input-area">
        <label for="file-input" class="btn btn-outline-secondary mb-0" title="Attach file">
            📎
        </label>
        <input type="file" id="file-input" accept="image/*,.pdf,.py,.js,.html,.ipynb" style="display: none;">
        <div style="position: relative; flex: 1;">
            <input type="text" id="user-input" class="form-control" placeholder="Ask a question about any book...">
            <div id="image-preview"
                style="display:none; position:absolute; bottom: 110%; left: 0; background:#fff; border:1px solid #ccc; border-radius:8px; padding:6px;">
                <img id="preview-img" style="max-height:80px; border-radius:4px;">
                <button id="remove-image"
                    style="position:absolute; top:-6px; right:-6px; background:red; color:white; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer;">✕</button>
            </div>
            <!-- Non-image file preview -->
            <div id="file-preview">
                <span id="file-name"></span>
            </div>
        </div>
        <button class="btn btn-primary" id="send-btn">Send</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<script>
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const csrfToken = "{{ csrf_token }}";
    const conversationHistory = [];
    const fileInput = document.getElementById('file-input');
    const imagePreview = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    const filePreview = document.getElementById('file-preview');
    const fileNameEl = document.getElementById('file-name');

    let attachedImageBase64 = null;
    let attachedImageType = null;
    let attachedPdfBase64 = null;
    let attachedFileText = null;
    let attachedFileName = null;

    function clearAttachment() {
        attachedImageBase64 = null;
        attachedImageType = null;
        attachedPdfBase64 = null;
        attachedFileText = null;
        attachedFileText = null;
        fileInput.value = '';
        imagePreview.style.display = 'none';
        filePreview.style.display = 'none';
    }

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.classList.add('message', isUser ? 'user-message' : 'bot-message');
        if (isUser) {
            div.textContent = text;
        } else {
            div.innerHTML = marked.parse(text);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Load saved history
    const savedHistory = {{ chat_history|safe }};
    savedHistory.forEach(msg => {
        addMessage(msg.content, msg.role === 'user');
        conversationHistory.push({ role: msg.role, content: msg.content });
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;

        clearAttachment();  // doesn't let you attach multiple files to one chat, fix later
        attachedFileName = file.name;
        const isImage = file.type.startsWith('image/');
        const isPdf = file.type === 'application/pdf' || file.name.endsWith('.pdf');

        const reader = new FileReader();
       
        if (isImage) {
            reader.onload = (e) => {
                const result = e.target.result;
                attachedImageBase64 = result.split(',')[1];
                attachedImageType = file.type;
                previewImg.src = result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else if (isPdf) {
            reader.onload = (e) => {
                attachedPdfBase64 = e.target.result.split(',')[1];
                fileNameEl.textContent = file.name;
                filePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            // read code files as plain text
            reader.onload = (e) => {
                attachedFileText = e.target.result;
                fileNameEl.textContent = file.name;
                filePreview.style.display = 'block';

            };
            reader.readAsText(file);
        }
    });

    document.getElementById('remove-image').addEventListener('click', clearAttachment);

    async function sendMessage() {
        console.log('SUBMIT CHAT');

        const message = inputEl.value.trim();
        if (!message && !attachedImageBase64 && !attachedPdfBase64 && !attachedFileText) return;

        // style and attach user message
        if (attachedImageBase64) {
            imagePreview.style.display = 'none';
            const div = document.createElement('div');
            div.classList.add('user-img-message');
            if (message) {
                const textEl = document.createElement('span');
                textEl.textContent = message;
                div.appendChild(textEl);
            }
            const imgEl = document.createElement('img');
            imgEl.src = previewImg.src;
            div.appendChild(imgEl);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (attachedPdfBase64 || attachedFileText) {
            addMessage(`${message ? message + ' ' : ''}[${attachedFileName}]`, true);
        } else {
            addMessage(message, true);
        }

        inputEl.value = '';
        sendBtn.disabled = true;
        conversationHistory.push({ role: 'user', content: message || `File attached: ${attachedFileName}` });

        const thinking = document.createElement('div');
        thinking.classList.add('message', 'bot-message');
        thinking.textContent = 'Thinking...';
        thinking.id = 'thinking';
        messagesEl.appendChild(thinking);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        try {
            const response = await fetch("{% url 'learning_logs:chat_message' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({
                    message,
                    history: conversationHistory,
                    image: attachedImageBase64,
                    image_type: attachedImageType,
                    pdf: attachedPdfBase64,
                    file_text: attachedFileText,
                    file_name: attachedFileName
                })
            });
            const data = await response.json();
            document.getElementById('thinking').remove();
            addMessage(data.answer, false);
            conversationHistory.push({ role: 'assistant', content: data.answer });
            clearAttachment();
        } catch (error) {
            document.getElementById('thinking').remove();
            addMessage('Sorry, something went wrong. Please try again.', false);
        }

        sendBtn.disabled = false;
        inputEl.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
{% endblock page_header %}
